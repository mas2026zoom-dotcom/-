name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'patch/go.txt'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply overlay
        run: |
          if [ -f patch/go.txt ]; then
            cat patch/part*.b64 | base64 -d > /tmp/overlay.zip
            unzip -o /tmp/overlay.zip -d .
            if [ -f patch/delete.txt ]; then xargs -r rm -f < patch/delete.txt; fi
            rm -rf patch
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Apply app redesign" || true
            git push || true
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install stable signing key
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || { echo "DEBUG_KEYSTORE_B64 secret missing"; exit 1; }
          mkdir -p ~/.android
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/stable.keystore"
          echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
          echo "STABLE_DEBUG_KEYSTORE=$RUNNER_TEMP/stable.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/stable.keystore" -storepass android | tail -2
      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon assembleDebug > build.log 2>&1
          code=$?
          tail -n 150 build.log
          exit $code
      - name: Publish build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|BUILD" -A3 build.log | head -n 200 > build-errors.txt || true
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build.log build-errors.txt --title "Build log" --notes "log" --target "$GITHUB_SHA" || true
      - uses: actions/upload-artifact@v4
        with:
          name: al-salah-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk al-salah-debug.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest al-salah-debug.apk --title "Al-Salah debug APK" --notes "Debug build" --target "$GITHUB_SHA"
  screens:
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: al-salah-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash ci/screens.sh
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots || true
          gh release delete screens-latest --yes --cleanup-tag || true
          gh release create screens-latest shots/* --title "Screens" --notes "screens" --target "$GITHUB_SHA" || true
