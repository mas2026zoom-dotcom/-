name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: al-salah-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk al-salah-debug.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest al-salah-debug.apk --title "Al-Salah debug APK" --notes "Debug build" --target "$GITHUB_SHA"
